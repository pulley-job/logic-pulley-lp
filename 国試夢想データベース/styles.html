<style>
    /* ========================================
   CSS Variables & Reset
   ======================================== */
    :root {
        --primary-color: #4a90d9;
        --primary-hover: #357abd;
        --secondary-color: #6c757d;
        --success-color: #28a745;
        --warning-color: #ffc107;
        --danger-color: #dc3545;
        --info-color: #17a2b8;

        --bg-color: #f5f7fa;
        --card-bg: #ffffff;
        --text-color: #333333;
        --text-muted: #6c757d;
        --border-color: #dee2e6;

        --header-height: 60px;
        --sidebar-width: 280px;
        --border-radius: 8px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
    }

    /* ========================================
   App Layout
   ======================================== */
    .app-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .app-header {
        background: linear-gradient(135deg, var(--primary-color), #2d5a8a);
        color: white;
        height: var(--header-height);
        padding: 0 24px;
        display: flex;
        align-items: center;
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
    }

    .app-title {
        font-size: 1.4rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .title-icon {
        font-size: 1.6rem;
    }

    .settings-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 8px 16px;
        border-radius: var(--border-radius);
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .settings-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    /* ========================================
   Tab Navigation
   ======================================== */
    .tab-nav {
        background: var(--card-bg);
        padding: 0 24px;
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border-color);
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
    }

    .tab-btn {
        background: none;
        border: none;
        padding: 16px 24px;
        font-size: 1rem;
        color: var(--text-muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.2s;
    }

    .tab-btn:hover {
        color: var(--primary-color);
        background: rgba(74, 144, 217, 0.05);
    }

    .tab-btn.active {
        color: var(--primary-color);
        border-bottom-color: var(--primary-color);
        font-weight: 600;
    }

    /* ========================================
   Main Content
   ======================================== */
    .main-content {
        flex: 1;
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    /* ========================================
   Cards
   ======================================== */
    .card {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        padding: 24px;
        margin-bottom: 24px;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
    }

    .card-title {
        font-size: 1.2rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* ========================================
   Form Elements
   ======================================== */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--text-color);
    }

    .form-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
    }

    .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 6px 12px;
        background: var(--bg-color);
        border-radius: var(--border-radius);
        transition: background 0.2s;
    }

    .checkbox-label:hover {
        background: rgba(74, 144, 217, 0.1);
    }

    .checkbox-label input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .radio-group {
        display: flex;
        gap: 16px;
    }

    .radio-label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
    }

    .help-text {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 6px;
    }

    /* ========================================
   Buttons
   ======================================== */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 20px;
        border: none;
        border-radius: var(--border-radius);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-primary {
        background: var(--primary-color);
        color: white;
    }

    .btn-primary:hover {
        background: var(--primary-hover);
    }

    .btn-secondary {
        background: var(--secondary-color);
        color: white;
    }

    .btn-secondary:hover {
        background: #5a6268;
    }

    .btn-success {
        background: var(--success-color);
        color: white;
    }

    .btn-success:hover {
        background: #218838;
    }

    .btn-outline {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
    }

    .btn-outline:hover {
        background: var(--bg-color);
    }

    .btn-lg {
        padding: 14px 28px;
        font-size: 1.1rem;
    }

    .btn-sm {
        padding: 6px 12px;
        font-size: 0.9rem;
    }

    .btn-group {
        display: flex;
        gap: 12px;
    }

    /* ========================================
   Question List
   ======================================== */
    .question-list {
        max-height: 500px;
        overflow-y: auto;
    }

    .question-item {
        display: flex;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        margin-bottom: 12px;
        transition: all 0.2s;
    }

    .question-item:hover {
        border-color: var(--primary-color);
        box-shadow: 0 2px 8px rgba(74, 144, 217, 0.1);
    }

    .question-item.selected {
        background: rgba(74, 144, 217, 0.05);
        border-color: var(--primary-color);
    }

    .question-checkbox {
        flex-shrink: 0;
    }

    .question-content {
        flex: 1;
    }

    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 8px;
    }

    .question-id {
        font-weight: 600;
        color: var(--primary-color);
    }

    .question-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .tag {
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--bg-color);
        color: var(--text-muted);
    }

    .tag-category {
        background: rgba(74, 144, 217, 0.1);
        color: var(--primary-color);
    }

    .tag-difficulty-A {
        background: rgba(40, 167, 69, 0.1);
        color: var(--success-color);
    }

    .tag-difficulty-B {
        background: rgba(255, 193, 7, 0.2);
        color: #856404;
    }

    .tag-difficulty-C {
        background: rgba(220, 53, 69, 0.1);
        color: var(--danger-color);
    }

    .tag-image {
        background: rgba(23, 162, 184, 0.1);
        color: var(--info-color);
    }

    .question-text {
        font-size: 0.95rem;
        color: var(--text-color);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* ========================================
   Result Summary
   ======================================== */
    .result-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        background: var(--bg-color);
        border-radius: var(--border-radius);
        margin-bottom: 16px;
    }

    .result-count {
        font-weight: 600;
        color: var(--primary-color);
    }

    .selection-actions {
        display: flex;
        gap: 8px;
    }

    /* ========================================
   Preview
   ======================================== */
    .preview-container {
        background: white;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 32px;
        max-height: 600px;
        overflow-y: auto;
    }

    .preview-question {
        margin-bottom: 32px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border-color);
    }

    .preview-question:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
    }

    .preview-header {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--primary-color);
        margin-bottom: 12px;
    }

    .preview-category {
        font-style: italic;
        color: var(--text-muted);
        margin-bottom: 16px;
    }

    .preview-text {
        margin-bottom: 16px;
        line-height: 1.8;
    }

    .preview-image {
        max-width: 100%;
        max-height: 300px;
        margin: 16px 0;
        border-radius: var(--border-radius);
    }

    .preview-choices {
        list-style: none;
        padding: 0;
    }

    .preview-choices li {
        padding: 8px 0;
    }

    .preview-answer {
        margin-top: 16px;
        padding: 16px;
        background: rgba(40, 167, 69, 0.1);
        border-radius: var(--border-radius);
    }

    .preview-answer strong {
        color: var(--success-color);
    }

    /* ========================================
   Modal
   ======================================== */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal.show {
        display: flex;
    }

    .modal-content {
        background: var(--card-bg);
        border-radius: var(--border-radius);
        width: 90%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-color);
    }

    .modal-header h2 {
        font-size: 1.2rem;
    }

    .close-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-muted);
        transition: color 0.2s;
    }

    .close-btn:hover {
        color: var(--danger-color);
    }

    .modal-body {
        padding: 24px;
    }

    /* ========================================
   Loading
   ======================================== */
    .loading-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .loading-overlay.show {
        display: flex;
    }

    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--border-color);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .loading-text {
        margin-top: 16px;
        color: var(--text-muted);
    }

    /* ========================================
   Toast
   ======================================== */
    .toast-container {
        position: fixed;
        top: 80px;
        right: 24px;
        z-index: 3000;
    }

    .toast {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        margin-bottom: 12px;
        background: var(--card-bg);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow-lg);
        transform: translateX(120%);
        transition: transform 0.3s ease;
    }

    .toast.show {
        transform: translateX(0);
    }

    .toast-success {
        border-left: 4px solid var(--success-color);
    }

    .toast-error {
        border-left: 4px solid var(--danger-color);
    }

    .toast-warning {
        border-left: 4px solid var(--warning-color);
    }

    .toast-info {
        border-left: 4px solid var(--info-color);
    }

    /* ========================================
   Empty State
   ======================================== */
    .empty-state {
        text-align: center;
        padding: 60px 24px;
        color: var(--text-muted);
    }

    .empty-state-icon {
        font-size: 4rem;
        margin-bottom: 16px;
    }

    .empty-state-text {
        font-size: 1.1rem;
    }

    /* ========================================
   Responsive
   ======================================== */
    @media (max-width: 768px) {
        .app-header {
            padding: 0 16px;
        }

        .app-title {
            font-size: 1.1rem;
        }

        .tab-nav {
            padding: 0 8px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 16px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .main-content {
            padding: 16px;
        }

        .form-row {
            grid-template-columns: 1fr;
        }

        .btn-group {
            flex-direction: column;
        }
    }
</style>
